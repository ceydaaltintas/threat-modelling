      Dokümanda belirtilmemiş güvenlik kararları (şifreleme, limit,
      saklamasüresi) yazılı hâle getirilmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.26", verification: needed }
      - { framework: "NIST SP 800-53", id: "SA-11" }
      - { framework: "OWASP ASVS", id: "ASVS-V1" }
