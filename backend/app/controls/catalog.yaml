    title: "Erişim kayıtları"
    area: log
    effort: "orta"
    text: >-
      Hassas veriye erişimler kaydedilmeli ve düzenli incelenmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.15", verification: needed }
      - { framework: "NIST SP 800-53", id: "AU-2" }
      - { framework: "NIST SP 800-53", id: "AU-6" }
      - { framework: "OWASP ASVS", id: "ASVS-V7" }
  - id: M-LOG-MASKING
    title: "Loglarda maskeleme"
    area: log
    effort: "düşük"
    text: >-
      Log yazımında IBAN, TCKN, token ve istek gövdeleri maskelenmeli veya hiç
      yazılmamalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.15", verification: needed }
      - { framework: "ISO 27001:2022", id: "A.8.11", verification: needed }
      - { framework: "OWASP ASVS", id: "ASVS-V7" }
  - id: M-LOG-LEVEL
    title: "Üretimde log seviyesi"
    area: log
    effort: "düşük"
    text: >-
      Üretimde hata ayıklama seviyesi kapatılmalı; gerektiğinde süreli ve
      onaylı açılmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.9", verification: needed }
      - { framework: "NIST SP 800-53", id: "CM-6" }
  - id: M-MONITORING
    title: "İzleme ve alarm"
    area: log
    effort: "orta"
    text: >-
      Anormal davranışlar için alarm kuralları tanımlanmalı ve bir ekibe
      yönlendirilmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.16", verification: needed }
      - { framework: "NIST SP 800-53", id: "SI-4" }
  - id: M-ANOMALY-DETECTION
    title: "Anomali tespiti"
    area: log
    effort: "yüksek"
    text: >-
      Hesap ve işlem davranışındaki sapmalar modellenmeli; eşik aşımında
      ekdoğrulama istenmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.16", verification: needed }
      - { framework: "NIST SP 800-53", id: "SI-4" }
  - id: M-DECISION-LOG
    title: "Karar kaydı"
    area: karar
    effort: "orta"
    text: >-
      Otomatik kararın girdileri, kural sürümü ve gerekçesi saklanmalı;
      müşteri itirazında gösterilebilmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.5.33", verification: needed }
      - { framework: "NIST SP 800-53", id: "AU-2" }
