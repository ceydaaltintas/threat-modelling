    title: "Webhook imza doğrulaması"
    area: ucuncu-taraf
    effort: "düşük"
    text: >-
      Gelen bildirimlerin imzası doğrulanmalı, zaman damgası kontrol edilmel
      ive tekrar saldırısı engellenmelidir.
    controls:
      - { framework: "NIST SP 800-53", id: "SI-7" }
      - { framework: "OWASP ASVS", id: "ASVS-V13" }
  - id: M-REALTIME-REVOCATION
    title: "Anlık iptal"
    area: ucuncu-taraf
    effort: "orta"
    text: >-
      Rıza veya sertifika iptali, bekleyen token ve oturumları gecikmeden
      geçersiz kılmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.5.19", verification: needed }
      - { framework: "NIST SP 800-53", id: "AC-3" }
      - { framework: "OWASP ASVS", id: "ASVS-V3" }
