    title: "API envanteri"
    area: api
    effort: "düşük"
    text: >-
      Tüm uçlar envanterde tutulmalı, sürümleri ve sahipleri bilinmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.9", verification: needed }
      - { framework: "NIST SP 800-53", id: "CM-7" }
  - id: M-DEPRECATION
    title: "Eski sürümlerin kapatılması"
    area: api
    effort: "orta"
    text: >-
      Kullanımdan kalkan uçlar duyurulmalı ve belirli bir takvimle
      kapatılmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.9", verification: needed }
      - { framework: "NIST SP 800-53", id: "CM-7" }
