      Uçlara kullanıcı, istemci ve IP bazında istek sınırı konmalı; sınır
      aşımında anlaşılır hata dönülmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.6", verification: needed }
      - { framework: "NIST SP 800-53", id: "SC-5" }
      - { framework: "OWASP ASVS", id: "ASVS-V13" }
  - id: M-QUOTA
    title: "Kota yönetimi"
    area: dayaniklilik
    effort: "orta"
    text: >-
      Pahalı veya üçüncü taraf maliyeti doğuran işlemler için günlük kota
      tanımlanmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.6", verification: needed }
      - { framework: "NIST SP 800-53", id: "SC-5" }
  - id: M-SERVER-SIDE-LIMIT
    title: "Sunucu tarafında sınır ve doğrulama"
    area: api
    effort: "düşük"
    text: >-
      Sayfa boyutu, tutar ve limit gibi değerler istemciden alınsa bile
      sunucuda üst sınıra bağlanmalı ve yeniden doğrulanmalıdır.
    controls:
      - { framework: "NIST SP 800-53", id: "SI-10" }
      - { framework: "OWASP ASVS", id: "ASVS-V5" }
  - id: M-INPUT-ALLOWLIST
    title: "Girdi izin listesi"
    area: api
    effort: "düşük"
    text: >-
      İstek gövdesinden yalnızca beklenen alanlar alınmalı; diğerleri yok
      sayılmalıdır.
    controls:
      - { framework: "NIST SP 800-53", id: "SI-10" }
      - { framework: "OWASP ASVS", id: "ASVS-V5" }
  - id: M-OUTPUT-ENCODING
    title: "Çıktı kodlama"
    area: web
    effort: "düşük"
    text: >-
      Kullanıcı girdisi sayfaya yazılırken bağlama uygun biçimde
      kaçışlanmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.28", verification: needed }
      - { framework: "OWASP ASVS", id: "ASVS-V5" }
  - id: M-CSP
    title: "İçerik güvenlik politikası"
    area: web
    effort: "düşük"
    text: >-
      Content-Security-Policy başlığıyla betik kaynakları sınırlanmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.9", verification: needed }
      - { framework: "NIST SP 800-53", id: "CM-6" }
      - { framework: "OWASP ASVS", id: "ASVS-V14" }
