    title: "Model sürüm yönetimi"
    area: yapay-zeka
    effort: "orta"
    text: >-
      Hangi sürümün ne zaman canlıda olduğu kayıt altında tutulmalı ve
      geridönülebilmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.32", verification: needed }
      - { framework: "NIST SP 800-53", id: "CM-6" }
  - id: M-PROMPT-ISOLATION
    title: "İstem yalıtımı"
    area: yapay-zeka
    effort: "düşük"
