      - { framework: "NIST SP 800-53", id: "SI-10" }
      - { framework: "OWASP ASVS", id: "ASVS-V12" }
  - id: M-MALWARE-SCAN
    title: "Zararlı yazılım taraması"
    area: belge
    effort: "orta"
    text: >-
      Yüklenen dosyalar işlenmeden önce taranmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.7", verification: needed }
      - { framework: "OWASP ASVS", id: "ASVS-V12" }
