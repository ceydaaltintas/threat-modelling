      Yavaşlayan bağımlılıklar için devre kesici kullanılmalı; kesici
      açıldığında davranış önceden tanımlanmış olmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.6", verification: needed }
      - { framework: "NIST SP 800-53", id: "SC-5" }
