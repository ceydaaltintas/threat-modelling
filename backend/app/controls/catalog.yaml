    title: "Güvenlik kontrolünde fail-closed"
    area: dayaniklilik
    effort: "orta"
    text: >-
      Güvenlik kontrolü yanıt vermediğinde işlem durdurulmalı veya ek
      doğrulamaya yönlendirilmeli; sessizce geçilmemelidir.
    controls:
      - { framework: "NIST SP 800-53", id: "SC-5" }
      - { framework: "OWASP ASVS", id: "ASVS-V11" }
  - id: M-FALLBACK
    title: "Yedek sağlayıcı veya yol"
    area: dayaniklilik
    effort: "yüksek"
