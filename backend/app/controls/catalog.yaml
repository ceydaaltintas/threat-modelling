      Kritik dış bağımlılıklar için ikinci sağlayıcı veya elle devam yolu
      tanımlanmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.5.19", verification: needed }
  - id: M-ATOMIC-COUNTER
    title: "Atomik sayaç güncellemesi"
    area: odeme
    effort: "orta"
    text: >-
      Limit sayaçları işlemle aynı atomik birimde güncellenmeli veya
      dağıtıkkilit kullanılmalıdır.
    controls:
      - { framework: "OWASP ASVS", id: "ASVS-V11" }
  - id: M-IDEMPOTENCY
    title: "Tekrar önleme anahtarı"
    area: odeme
    effort: "orta"
