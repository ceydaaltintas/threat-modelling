      yalnızca eklenebilir bir kayda yazılmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.5.33", verification: needed }
      - { framework: "ISO 27001:2022", id: "A.8.15", verification: needed }
      - { framework: "NIST SP 800-53", id: "AU-2" }
      - { framework: "NIST SP 800-53", id: "AU-9" }
      - { framework: "OWASP ASVS", id: "ASVS-V7" }
