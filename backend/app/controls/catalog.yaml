      Dış sistemlerle gün içi ve gün sonu mutabakat yapılmalı; tutarsızlıkla
      ralarma bağlanmalıdır.
    controls:
      - { framework: "ISO 27001:2022", id: "A.5.33", verification: needed }
      - { framework: "NIST SP 800-53", id: "AU-6" }
  - id: M-TRANSACTION-SIGNING
    title: "İşlem imzalama"
    area: odeme
    effort: "yüksek"
