    title: "Bildirim içeriğinin daraltılması"
    area: mobil
    effort: "düşük"
    text: >-
      Bildirimlerde bakiye, tutar ve kod gibi bilgiler gösterilmemeli; ayrıntı
      için uygulamaya yönlendirilmelidir.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.11", verification: needed }
  - id: M-OPAQUE-ID
    title: "Tahmin edilemeyen kaynak kimliği"
    area: api
    effort: "düşük"
    text: >-
      Dışarıya açılan kaynak numaraları sıralı olmamalı; rastgele veya
      opakkimlik kullanılmalıdır.
    controls:
      - { framework: "OWASP ASVS", id: "ASVS-V4" }
  - id: M-RATE-LIMIT
    title: "Hız sınırlama"
    area: dayaniklilik
    effort: "düşük"
