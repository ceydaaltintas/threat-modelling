      Ödeme talimatları imzalanmalı ve imza saklanmalı; böylece içerik
      değiştirilemez ve inkâr edilemez.
    controls:
      - { framework: "ISO 27001:2022", id: "A.8.24", verification: needed }
      - { framework: "NIST SP 800-53", id: "SI-7" }
